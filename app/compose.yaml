# Local Postgres for development. Run `docker compose up -d` from app/; Compose reads app/.env for the values below.
services:
  db:
    image: docker.io/postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${SERVER_DB_DATABASE:-vue3scaffold}
      POSTGRES_USER: ${SERVER_DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${SERVER_DB_PASSWORD:?Set SERVER_DB_PASSWORD in app/.env}
    ports:
      - ${SERVER_DB_PORT:-5432}:5432
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data:
